name: Build & Release Arrowroot APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR not found; generating via system gradle..."
            gradle wrapper --gradle-version 8.4 || true
          fi
          chmod +x gradlew || true

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'vmouse123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'vmouse123' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace || gradle assembleRelease --no-daemon --stacktrace

      - name: Align, Sign & Verify APK Integrity
        id: apk
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'vmouse123' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'vmouse123' }}
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found built APK: $RAW_APK"

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          VERSION=$(grep -m1 versionName app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          OUT_NAME="Arrowroot-v${VERSION}-build-${{ github.run_number }}.apk"
          OUT_PATH="app/build/outputs/apk/$OUT_NAME"

          "$ZIPALIGN" -p -f -v 4 "$RAW_APK" "$OUT_PATH.aligned"
          "$APKSIGNER" sign \
            --ks app/vmouse.keystore \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --ks-key-alias vmouse_key \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT_PATH" \
            "$OUT_PATH.aligned"
          rm -f "$OUT_PATH.aligned"

          echo "Verifying APK zip structure and V1/V2/V3 signatures..."
          unzip -t "$OUT_PATH" >/dev/null
          "$APKSIGNER" verify --verbose --print-certs "$OUT_PATH"

          echo "apk_path=$OUT_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$OUT_NAME" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Extract Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          awk -v t="[$TAG]" 'index($0,"## "t)==1{f=1;next} /^## \[/{if(f)exit} f' CHANGELOG.md > release_notes.md
          printf '\n---\nAPK: `%s`\n' "${{ steps.apk.outputs.apk_name }}" >> release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.apk_path }}
          name: "Arrowroot ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
